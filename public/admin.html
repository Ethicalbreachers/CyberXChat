<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Panel — CyberChat</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
body {
  background: #0a0e1a;
  color: #e8ecf3;
  padding: 24px;
  min-height: 100vh;
  background-image: radial-gradient(circle at 20% 20%, rgba(99,102,241,0.15), transparent 50%),
                    radial-gradient(circle at 80% 80%, rgba(168,85,247,0.12), transparent 50%);
}
.container { max-width: 1100px; margin: 0 auto; }
h1 { font-size: 32px; margin-bottom: 8px; background: linear-gradient(135deg, #6366f1, #a855f7, #ec4899); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
.subtitle { color: #8b95a8; margin-bottom: 32px; }
.card {
  background: rgba(26,33,48,0.85);
  backdrop-filter: blur(20px);
  border: 1px solid #2a3446;
  border-radius: 20px;
  padding: 28px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.4);
}
label { display: block; font-size: 12px; color: #8b95a8; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; }
input {
  width: 100%;
  padding: 14px 18px;
  border-radius: 12px;
  border: 1.5px solid #2a3446;
  background: #111827;
  color: #e8ecf3;
  font-size: 14px;
  outline: none;
  transition: all 0.2s;
  margin-bottom: 16px;
}
input:focus { border-color: #6366f1; box-shadow: 0 0 0 3px rgba(99,102,241,0.4); }
button {
  padding: 12px 24px;
  border-radius: 12px;
  border: none;
  background: linear-gradient(135deg, #6366f1, #a855f7);
  color: #fff;
  font-weight: 700;
  font-size: 14px;
  cursor: pointer;
  transition: all 0.25s;
  box-shadow: 0 6px 20px rgba(99,102,241,0.4);
}
button:hover { transform: translateY(-2px); box-shadow: 0 10px 28px rgba(99,102,241,0.6); }
button.danger { background: linear-gradient(135deg, #ef4444, #dc2626); box-shadow: 0 6px 20px rgba(239,68,68,0.3); }
button.small { padding: 8px 14px; font-size: 12px; }
#auth { max-width: 400px; margin: 100px auto 0; }
#auth h2 { text-align: center; margin-bottom: 24px; }
table { width: 100%; border-collapse: collapse; margin-top: 20px; }
th { text-align: left; padding: 12px; font-size: 12px; color: #8b95a8; text-transform: uppercase; border-bottom: 1px solid #2a3446; }
td { padding: 14px 12px; border-bottom: 1px solid #2a3446; font-size: 14px; }
tr:hover td { background: rgba(99,102,241,0.05); }
td input { margin: 0; padding: 8px 12px; width: 70px; text-align: center; font-size: 18px; }
.avatar-mini { width: 36px; height: 36px; border-radius: 50%; object-fit: cover; border: 2px solid #2a3446; vertical-align: middle; margin-right: 10px; }
.user-cell { display: flex; align-items: center; gap: 10px; }
</style>
</head>
<body>
<div class="container">
  <h1>🔧 CyberChat Admin</h1>
  <p class="subtitle">Manage users, emoji, and bans</p>

  <div id="auth" class="card">
    <h2>Admin Login</h2>
    <label>Username</label>
    <input id="u" placeholder="admin"/>
    <label>Password</label>
    <input id="p" type="password" placeholder="••••••••" onkeypress="if(event.key==='Enter')login()"/>
    <button onclick="login()" style="width:100%">Login</button>
  </div>

  <div id="panel" class="card" style="display:none">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px">
      <h2>Users</h2>
      <button class="danger small" onclick="location.reload()">Logout</button>
    </div>
    <table id="tbl">
      <thead>
        <tr>
          <th>User</th>
          <th>Username</th>
          <th>Email</th>
          <th>Emoji</th>
          <th>Status</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<script>
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyADtnh5wIUO4mBaX4Co6Q_jKYzhzSgZ6p0",
  authDomain: "xcyberchat-dd4f5.firebaseapp.com",
  databaseURL: "https://xcyberchat-dd4f5-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "xcyberchat-dd4f5",
  storageBucket: "xcyberchat-dd4f5.firebasestorage.app",
  messagingSenderId: "212631602126",
  appId: "1:212631602126:web:e322b6d41da4b8e657619f"
};

firebase.initializeApp(FIREBASE_CONFIG);
const db = firebase.database();

function login(){
  if(document.getElementById('u').value==='admin' && document.getElementById('p').value==='admin123'){
    document.getElementById('auth').style.display='none';
    document.getElementById('panel').style.display='block';
    loadUsers();
  } else alert('❌ Wrong admin credentials');
}

function loadUsers(){
  db.ref('banned').on('value', (bSnap) => {
    const banned = bSnap.val() || {};
    db.ref('users').on('value', s => {
      const users = s.val() || {};
      const tb = document.querySelector('#tbl tbody');
      tb.innerHTML = '';
      const arr = Object.values(users);
      if (!arr.length) {
        tb.innerHTML = '<tr><td colspan="6" style="text-align:center;color:#8b95a8;padding:40px">No users yet</td></tr>';
        return;
      }
      arr.forEach(u => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>
            <div class="user-cell">
              <img class="avatar-mini" src="${u.avatar || 'https://via.placeholder.com/36'}"/>
              <strong>${u.name}</strong>
            </div>
          </td>
          <td>@${u.username}</td>
          <td>${u.email||''}</td>
          <td><input value="${u.emoji||''}" onchange="setEmoji('${u.uid}', this.value)" placeholder="😀"/></td>
          <td>${u.online ? '🟢 online' : '⚪ offline'}</td>
          <td>
            ${banned[u.uid] 
              ? `<button class="small" onclick="unban('${u.uid}')">Unban</button>` 
              : `<button class="danger small" onclick="ban('${u.uid}')">Ban</button>`}
          </td>`;
        tb.appendChild(tr);
      });
    });
  });
}

function setEmoji(uid, em){ db.ref('users/'+uid+'/emoji').set(em); }
function ban(uid){ if(confirm('Ban this user?')) db.ref('banned/'+uid).set(true); }
function unban(uid){ db.ref('banned/'+uid).remove(); }
</script>
</body>
</html>
