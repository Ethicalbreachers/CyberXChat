<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<meta name="theme-color" content="#0a0e1a"/>
<title>CyberChat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ================= RESET & BASE ================= */
* { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; -webkit-tap-highlight-color: transparent; }
:root {
  --bg-primary: #0a0e1a;
  --bg-secondary: #111827;
  --bg-card: #1a2130;
  --bg-hover: #232b3d;
  --border: #2a3446;
  --text: #e8ecf3;
  --text-dim: #8b95a8;
  --accent: #6366f1;
  --accent-hover: #4f46e5;
  --accent-glow: rgba(99, 102, 241, 0.4);
  --success: #10b981;
  --danger: #ef4444;
  --warning: #f59e0b;
  --gradient: linear-gradient(135deg, #6366f1 0%, #a855f7 50%, #ec4899 100%);
  --nav-height: 72px;
}
html, body { height: 100%; }
body {
  background: var(--bg-primary);
  color: var(--text);
  overflow: hidden;
  font-size: 14px;
  line-height: 1.5;
}
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background: radial-gradient(circle at 20% 20%, rgba(99,102,241,0.15), transparent 50%),
              radial-gradient(circle at 80% 80%, rgba(168,85,247,0.12), transparent 50%);
  z-index: -1;
  animation: bgFloat 20s ease-in-out infinite;
}
@keyframes bgFloat {
  0%,100% { transform: translate(0,0) scale(1); }
  50% { transform: translate(20px,-20px) scale(1.05); }
}

#app {
  max-width: 480px;
  margin: 0 auto;
  height: 100vh;
  position: relative;
  background: var(--bg-secondary);
  display: flex;
  flex-direction: column;
  box-shadow: 0 0 60px rgba(0,0,0,0.5);
  overflow: hidden;
}

.screen { display: none; flex-direction: column; height: 100%; }
.screen.active { display: flex; }

/* ================= AUTH SCREEN ================= */
#authScreen {
  justify-content: center;
  align-items: center;
  padding: 24px;
  overflow-y: auto;
}
.auth-box {
  width: 100%;
  max-width: 400px;
  background: rgba(26, 33, 48, 0.85);
  backdrop-filter: blur(20px);
  border: 1px solid var(--border);
  border-radius: 24px;
  padding: 32px 28px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.4);
  animation: slideUp 0.5s cubic-bezier(0.16, 1, 0.3, 1);
}
@keyframes slideUp {
  from { opacity: 0; transform: translateY(30px); }
  to { opacity: 1; transform: translateY(0); }
}
.auth-logo { text-align: center; margin-bottom: 28px; }
.auth-logo .logo-icon {
  width: 64px; height: 64px;
  margin: 0 auto 12px;
  background: var(--gradient);
  border-radius: 18px;
  display: flex; align-items: center; justify-content: center;
  font-size: 32px;
  box-shadow: 0 8px 24px var(--accent-glow);
}
.auth-logo h1 {
  font-size: 26px;
  font-weight: 700;
  background: var(--gradient);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}
.auth-logo p { color: var(--text-dim); font-size: 13px; margin-top: 4px; }

.tabs {
  display: flex;
  margin-bottom: 24px;
  background: var(--bg-secondary);
  border-radius: 14px;
  padding: 4px;
}
.tab {
  flex: 1;
  padding: 10px;
  background: transparent;
  border: none;
  color: var(--text-dim);
  cursor: pointer;
  font-weight: 600;
  font-size: 14px;
  border-radius: 10px;
  transition: all 0.25s;
}
.tab.active {
  background: var(--accent);
  color: #fff;
  box-shadow: 0 4px 12px var(--accent-glow);
}

.form { display: none; flex-direction: column; gap: 14px; }
.form.active { display: flex; animation: fadeIn 0.3s; }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

.input-group { position: relative; display: flex; align-items: center; }
.input-group .icon {
  position: absolute;
  left: 14px;
  color: var(--text-dim);
  font-size: 16px;
  pointer-events: none;
}
.form input, .form textarea {
  width: 100%;
  padding: 14px 14px 14px 42px;
  border-radius: 12px;
  border: 1.5px solid var(--border);
  background: var(--bg-secondary);
  color: var(--text);
  font-size: 14px;
  transition: all 0.2s;
  outline: none;
}
.form input:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-glow);
}
.form input::placeholder { color: var(--text-dim); }

.btn-primary {
  padding: 14px;
  border-radius: 12px;
  border: none;
  background: var(--gradient);
  color: #fff;
  font-weight: 700;
  font-size: 15px;
  cursor: pointer;
  transition: all 0.25s;
  box-shadow: 0 6px 20px var(--accent-glow);
  margin-top: 4px;
}
.btn-primary:hover { transform: translateY(-2px); box-shadow: 0 10px 28px var(--accent-glow); }

.form a {
  color: var(--accent);
  font-size: 13px;
  text-align: center;
  text-decoration: none;
  font-weight: 500;
}
.form a:hover { color: #a855f7; text-decoration: underline; }

/* ================= APP HEADER ================= */
.app-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 16px 18px;
  background: rgba(26, 33, 48, 0.9);
  backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--border);
  z-index: 5;
  flex-shrink: 0;
}
.app-header h2 {
  font-size: 20px;
  font-weight: 700;
  background: var(--gradient);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}
.header-actions { display: flex; gap: 8px; position: relative; }
.hdr-btn {
  background: var(--bg-secondary);
  border: 1.5px solid var(--border);
  color: var(--text);
  padding: 8px 12px;
  border-radius: 12px;
  cursor: pointer;
  font-size: 18px;
  font-weight: 700;
  transition: all 0.2s;
  width: 40px; height: 40px;
  display: flex; align-items: center; justify-content: center;
}
.hdr-btn:hover { background: var(--bg-hover); border-color: var(--accent); }

/* ================= VIEWS ================= */
.view {
  display: none;
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  padding-bottom: 8px;
}
.view.active { display: flex; flex-direction: column; animation: fadeIn 0.3s; }
.view::-webkit-scrollbar { width: 4px; }
.view::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

.list { padding: 12px; }

/* ================= USER / CHAT ITEM ================= */
.user-item, .chat-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px;
  background: var(--bg-card);
  border-radius: 14px;
  margin-bottom: 10px;
  cursor: pointer;
  transition: all 0.25s;
  border: 1px solid transparent;
  position: relative;
  overflow: hidden;
}
.user-item::before, .chat-item::before {
  content: '';
  position: absolute;
  left: 0; top: 0; bottom: 0;
  width: 3px;
  background: var(--gradient);
  transform: scaleY(0);
  transition: transform 0.25s;
}
.user-item:hover, .chat-item:hover {
  background: var(--bg-hover);
  border-color: var(--border);
}
.user-item:hover::before, .chat-item:hover::before { transform: scaleY(1); }

.user-item img, .chat-item img {
  width: 48px; height: 48px;
  border-radius: 50%;
  object-fit: cover;
  border: 2px solid var(--border);
  flex-shrink: 0;
}
.user-meta { flex: 1; min-width: 0; }
.user-meta strong {
  display: block;
  font-size: 14px;
  font-weight: 600;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.user-meta small {
  color: var(--text-dim);
  font-size: 12px;
  display: block;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.item-actions { display: flex; gap: 6px; flex-shrink: 0; }
.item-actions button {
  padding: 7px 10px;
  border-radius: 8px;
  border: none;
  background: var(--accent);
  color: #fff;
  cursor: pointer;
  font-size: 11px;
  font-weight: 600;
  transition: all 0.2s;
}
.item-actions button:hover { background: var(--accent-hover); transform: scale(1.05); }
.item-actions button.req { background: var(--warning); }
.item-actions button.req:hover { background: #d97706; }

.unread-dot {
  background: var(--danger);
  color: #fff;
  border-radius: 10px;
  padding: 2px 8px;
  font-size: 11px;
  font-weight: 700;
  margin-left: 6px;
}

/* ================= PROFILE ================= */
.profile-edit, .profile-card {
  padding: 24px;
  display: flex;
  flex-direction: column;
  gap: 16px;
  align-items: center;
}
.avatar-wrap {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
}
.avatar-wrap img, .profile-card img {
  width: 110px; height: 110px;
  border-radius: 50%;
  object-fit: cover;
  border: 3px solid transparent;
  background: linear-gradient(var(--bg-card), var(--bg-card)) padding-box,
              var(--gradient) border-box;
  box-shadow: 0 8px 24px rgba(99,102,241,0.3);
}
.avatar-wrap button {
  padding: 8px 16px;
  border-radius: 10px;
  border: 1.5px solid var(--border);
  background: var(--bg-card);
  color: var(--text);
  cursor: pointer;
  font-size: 12px;
  font-weight: 600;
  transition: all 0.2s;
}
.avatar-wrap button:hover { border-color: var(--accent); color: var(--accent); }

.profile-edit label {
  width: 100%;
  display: flex;
  flex-direction: column;
  gap: 6px;
  font-size: 12px;
  color: var(--text-dim);
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}
.profile-edit input, .profile-edit textarea {
  padding: 12px 14px;
  border-radius: 12px;
  border: 1.5px solid var(--border);
  background: var(--bg-card);
  color: var(--text);
  font-size: 14px;
  outline: none;
  transition: all 0.2s;
  font-family: inherit;
  text-transform: none;
  letter-spacing: normal;
}
.profile-edit input:focus, .profile-edit textarea:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-glow);
}
.profile-edit textarea { min-height: 80px; resize: vertical; }
.profile-edit button, .profile-card button {
  padding: 12px 28px;
  border-radius: 12px;
  border: none;
  background: var(--gradient);
  color: #fff;
  cursor: pointer;
  font-weight: 700;
  font-size: 14px;
  box-shadow: 0 6px 20px var(--accent-glow);
  transition: all 0.25s;
}
.profile-edit button:hover, .profile-card button:hover { transform: translateY(-2px); }

.profile-card h2 { font-size: 22px; margin-top: 4px; }
.profile-card p { color: var(--text-dim); font-size: 14px; }

/* ================= SETTINGS ================= */
.settings { padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.setting-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: var(--bg-card);
  padding: 16px;
  border-radius: 14px;
  border: 1px solid var(--border);
  font-weight: 500;
}
.setting-row button {
  padding: 8px 16px;
  border-radius: 8px;
  border: none;
  background: var(--accent);
  color: #fff;
  cursor: pointer;
  font-weight: 600;
  font-size: 13px;
  transition: all 0.2s;
}
.setting-row button:hover { background: var(--accent-hover); }
.settings h3 {
  margin-top: 12px;
  color: var(--text-dim);
  font-size: 12px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 1px;
}
#devicesList { display: flex; flex-direction: column; gap: 8px; }
.device-item {
  background: var(--bg-card);
  padding: 12px 14px;
  border-radius: 12px;
  font-size: 12px;
  color: var(--text-dim);
  border: 1px solid var(--border);
  word-break: break-all;
}
.danger {
  background: linear-gradient(135deg, #ef4444, #dc2626) !important;
  padding: 14px !important;
  border-radius: 12px !important;
  border: none !important;
  color: #fff !important;
  cursor: pointer;
  font-weight: 700;
  font-size: 14px;
  box-shadow: 0 6px 20px rgba(239,68,68,0.3) !important;
  transition: all 0.25s !important;
  margin-top: 8px;
}
.danger:hover { transform: translateY(-2px); box-shadow: 0 10px 28px rgba(239,68,68,0.5) !important; }

/* Switch */
.switch { position: relative; display: inline-block; width: 46px; height: 26px; }
.switch input { opacity: 0; width: 0; height: 0; }
.slider {
  position: absolute; cursor: pointer;
  top: 0; left: 0; right: 0; bottom: 0;
  background: var(--bg-secondary);
  border: 1.5px solid var(--border);
  transition: .3s;
  border-radius: 26px;
}
.slider:before {
  content: "";
  position: absolute;
  height: 18px; width: 18px;
  left: 3px; bottom: 2px;
  background: var(--text-dim);
  transition: .3s;
  border-radius: 50%;
}
.switch input:checked + .slider {
  background: var(--accent);
  border-color: var(--accent);
  box-shadow: 0 0 12px var(--accent-glow);
}
.switch input:checked + .slider:before {
  transform: translateX(20px);
  background: #fff;
}

/* ================= CHAT VIEW ================= */
.chat-view {
  display: none;
  flex-direction: column;
  height: 100%;
  overflow: hidden;
  padding-bottom: 0 !important;
  position: absolute;
  inset: 0;
  background: var(--bg-secondary);
  z-index: 50;
}
.chat-view.active { display: flex; }

.chat-header {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 14px;
  background: rgba(26, 33, 48, 0.98);
  backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
  z-index: 5;
}
.chat-header img {
  width: 42px; height: 42px;
  border-radius: 50%;
  object-fit: cover;
  border: 2px solid var(--accent);
}
.chat-header > button {
  background: var(--bg-card);
  border: 1.5px solid var(--border);
  color: var(--text);
  font-size: 20px;
  cursor: pointer;
  width: 40px; height: 40px;
  border-radius: 12px;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.2s;
  flex-shrink: 0;
  font-weight: 700;
}
.chat-header > button:hover {
  background: var(--accent);
  border-color: var(--accent);
  color: #fff;
  transform: translateX(-2px);
}
.chat-header > button:active { transform: translateX(-2px) scale(0.95); }

.peer-info { flex: 1; min-width: 0; }
.peer-info strong {
  display: block;
  font-size: 15px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.peer-info small {
  color: var(--text-dim);
  font-size: 12px;
  display: block;
}

.messages {
  flex: 1;
  overflow-y: auto;
  padding: 16px 14px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  background: var(--bg-secondary);
  background-image:
    radial-gradient(circle at 10% 10%, rgba(99,102,241,0.05), transparent 30%),
    radial-gradient(circle at 90% 90%, rgba(168,85,247,0.05), transparent 30%);
}
.messages::-webkit-scrollbar { width: 4px; }
.messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

.msg {
  max-width: 75%;
  padding: 10px 14px;
  border-radius: 16px;
  font-size: 14px;
  position: relative;
  word-wrap: break-word;
  animation: msgIn 0.25s cubic-bezier(0.16, 1, 0.3, 1);
  line-height: 1.4;
}
@keyframes msgIn {
  from { opacity: 0; transform: translateY(8px) scale(0.96); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}
.msg.me {
  align-self: flex-end;
  background: var(--gradient);
  color: #fff;
  border-bottom-right-radius: 4px;
  box-shadow: 0 4px 12px var(--accent-glow);
}
.msg.them {
  align-self: flex-start;
  background: var(--bg-card);
  color: var(--text);
  border: 1px solid var(--border);
  border-bottom-left-radius: 4px;
}
.msg .time {
  font-size: 10px;
  color: rgba(255,255,255,0.7);
  display: block;
  text-align: right;
  margin-top: 4px;
}
.msg.them .time { color: var(--text-dim); }
.msg .unsend {
  position: absolute;
  top: -8px; right: -8px;
  background: var(--danger);
  color: #fff;
  border-radius: 50%;
  width: 20px; height: 20px;
  font-size: 12px;
  font-weight: 700;
  border: 2px solid var(--bg-secondary);
  cursor: pointer;
  display: none;
  align-items: center;
  justify-content: center;
  line-height: 1;
}
.msg.me:hover .unsend { display: flex; }

/* ============ SEND FORM ============ */
.send-form {
  display: flex;
  gap: 10px;
  padding: 12px 14px;
  background: rgba(26, 33, 48, 0.98);
  backdrop-filter: blur(20px);
  border-top: 1px solid var(--border);
  flex-shrink: 0;
  align-items: center;
}
.send-form input {
  flex: 1;
  padding: 13px 18px;
  border-radius: 24px;
  border: 1.5px solid var(--border);
  background: var(--bg-secondary);
  color: var(--text);
  font-size: 14px;
  outline: none;
  transition: all 0.2s;
}
.send-form input:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-glow);
}
.send-form input::placeholder { color: var(--text-dim); }
.send-form button {
  width: 46px;
  height: 46px;
  border-radius: 50%;
  border: none;
  background: var(--gradient);
  color: #fff;
  cursor: pointer;
  font-size: 18px;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 4px 16px var(--accent-glow);
  transition: all 0.25s;
  flex-shrink: 0;
}
.send-form button:hover { transform: scale(1.08); }
.send-form button:active { transform: scale(0.95); }

/* ================= DROPDOWN ================= */
.dropdown {
  position: absolute;
  top: 56px;
  right: 12px;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 6px;
  z-index: 20;
  min-width: 220px;
  box-shadow: 0 12px 32px rgba(0,0,0,0.5);
  animation: dropIn 0.2s;
}
@keyframes dropIn {
  from { opacity: 0; transform: translateY(-8px); }
  to { opacity: 1; transform: translateY(0); }
}
.dropdown button {
  display: block;
  width: 100%;
  padding: 10px 14px;
  background: transparent;
  border: none;
  color: var(--text);
  text-align: left;
  cursor: pointer;
  border-radius: 8px;
  font-size: 13px;
  font-weight: 500;
  transition: all 0.2s;
}
.dropdown button:hover { background: var(--bg-hover); color: var(--danger); }
.hidden { display: none !important; }

/* ================= BACK BUTTONS ================= */
.back-top {
  background: var(--bg-card) !important;
  border: 1.5px solid var(--border) !important;
  color: var(--text) !important;
  width: 44px !important;
  height: 44px !important;
  border-radius: 14px !important;
  cursor: pointer;
  font-size: 20px;
  font-weight: 700;
  margin: 16px !important;
  display: flex !important;
  align-items: center;
  justify-content: center;
  transition: all 0.2s;
  padding: 0 !important;
  box-shadow: none !important;
}
.back-top:hover {
  background: var(--accent) !important;
  border-color: var(--accent) !important;
  color: #fff !important;
  transform: translateX(-3px);
}

/* ================= BOTTOM NAVIGATION ================= */
.bottom-nav {
  display: flex;
  justify-content: space-around;
  align-items: center;
  background: rgba(26, 33, 48, 0.98);
  backdrop-filter: blur(24px);
  border-top: 1px solid var(--border);
  padding: 8px 6px 10px;
  flex-shrink: 0;
  z-index: 30;
  box-shadow: 0 -8px 24px rgba(0,0,0,0.3);
  position: relative;
}
.bottom-nav.hidden { display: none !important; }

.nav-btn {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3px;
  padding: 8px 4px;
  background: transparent;
  border: none;
  color: var(--text-dim);
  cursor: pointer;
  border-radius: 14px;
  transition: all 0.25s;
  position: relative;
  font-family: inherit;
}
.nav-btn .nav-icon {
  font-size: 22px;
  transition: all 0.25s;
  line-height: 1;
}
.nav-btn .nav-label {
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.3px;
  text-transform: uppercase;
}
.nav-btn:hover { color: var(--text); background: rgba(99,102,241,0.08); }
.nav-btn:active { transform: scale(0.94); }

.nav-btn.active { color: #fff; }
.nav-btn.active .nav-icon {
  transform: translateY(-3px) scale(1.15);
  filter: drop-shadow(0 4px 8px var(--accent-glow));
}
.nav-btn.active .nav-label {
  color: var(--accent);
  font-weight: 700;
}
.nav-btn.active::before {
  content: '';
  position: absolute;
  top: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 32px;
  height: 3px;
  background: var(--gradient);
  border-radius: 0 0 4px 4px;
  animation: navIndicator 0.3s;
}
@keyframes navIndicator {
  from { width: 0; opacity: 0; }
  to { width: 32px; opacity: 1; }
}

.nav-badge {
  position: absolute;
  top: 2px;
  right: 22%;
  background: var(--danger);
  color: #fff;
  font-size: 10px;
  font-weight: 700;
  padding: 1px 6px;
  border-radius: 10px;
  min-width: 18px;
  text-align: center;
  box-shadow: 0 2px 8px rgba(239,68,68,0.6);
  animation: pulse 2s infinite;
}
@keyframes pulse {
  0%,100% { transform: scale(1); }
  50% { transform: scale(1.1); }
}

/* ================= TOAST ================= */
.toast {
  position: fixed;
  bottom: 90px;
  left: 50%;
  transform: translateX(-50%);
  background: var(--bg-card);
  color: var(--text);
  padding: 12px 22px;
  border-radius: 12px;
  border: 1px solid var(--border);
  z-index: 100;
  font-size: 14px;
  font-weight: 500;
  box-shadow: 0 12px 32px rgba(0,0,0,0.5);
  animation: toastIn 0.3s;
  max-width: 90%;
  text-align: center;
}
@keyframes toastIn {
  from { opacity: 0; transform: translateX(-50%) translateY(20px); }
  to { opacity: 1; transform: translateX(-50%) translateY(0); }
}

/* Empty state */
.empty-state {
  text-align: center;
  padding: 60px 20px;
  color: var(--text-dim);
}
.empty-state .icon { font-size: 56px; margin-bottom: 14px; opacity: 0.4; }
.empty-state p { font-size: 14px; }

/* ================= RESPONSIVE ================= */
@media (max-width: 480px) {
  #app { max-width: 100%; }
  .item-actions button { padding: 6px 8px; font-size: 10px; }
  .nav-btn .nav-label { font-size: 9px; }
}
</style>
</head>
<body>
<div id="app">

  <!-- ============ AUTH SCREEN ============ -->
  <div id="authScreen" class="screen active">
    <div class="auth-box">
      <div class="auth-logo">
        <div class="logo-icon">💬</div>
        <h1>CyberChat</h1>
        <p>Connect. Chat. Real-time.</p>
      </div>

      <div class="tabs">
        <button id="loginTab" class="tab active">Login</button>
        <button id="registerTab" class="tab">Register</button>
      </div>

      <form id="loginForm" class="form active">
        <div class="input-group">
          <span class="icon">👤</span>
          <input type="text" id="loginEmail" placeholder="Email or Username" required />
        </div>
        <div class="input-group">
          <span class="icon">🔒</span>
          <input type="password" id="loginPassword" placeholder="Password" required />
        </div>
        <button type="submit" class="btn-primary">Login</button>
        <a href="#" id="forgotLink">Forgot Password?</a>
      </form>

      <form id="registerForm" class="form">
        <div class="input-group">
          <span class="icon">📝</span>
          <input type="text" id="regName" placeholder="Full Name" required />
        </div>
        <div class="input-group">
          <span class="icon">@</span>
          <input type="text" id="regUsername" placeholder="Username" required />
        </div>
        <div class="input-group">
          <span class="icon">✉️</span>
          <input type="email" id="regEmail" placeholder="Gmail (must be @gmail.com)" required />
        </div>
        <div class="input-group">
          <span class="icon">🔒</span>
          <input type="password" id="regPassword" placeholder="Password" required />
        </div>
        <button type="submit" class="btn-primary">Create Account</button>
      </form>

      <form id="forgotForm" class="form">
        <div class="input-group">
          <span class="icon">✉️</span>
          <input type="email" id="forgotEmail" placeholder="Your Gmail" required />
        </div>
        <button type="submit" class="btn-primary">Reset Password</button>
        <a href="#" id="backLogin">Back to Login</a>
      </form>
    </div>
  </div>

  <!-- ============ MAIN APP ============ -->
  <div id="mainScreen" class="screen">
    <header class="app-header" id="appHeader">
      <h2 id="appTitle">Users</h2>
      <div class="header-actions" id="headerActions">
        <button id="chatMenuBtn" class="hdr-btn hidden" title="Menu">⋮</button>
        <div id="chatMenu" class="dropdown hidden">
          <button id="clearChatBtn">🗑️ Clear Chat (for everyone)</button>
        </div>
      </div>
    </header>

    <!-- USERS VIEW -->
    <section id="usersView" class="view active">
      <div id="usersList" class="list"></div>
    </section>

    <!-- CHATS VIEW -->
    <section id="chatsView" class="view">
      <div id="chatsList" class="list"></div>
    </section>

    <!-- PROFILE VIEW -->
    <section id="profileView" class="view">
      <div class="profile-edit">
        <div class="avatar-wrap">
          <img id="myAvatar" src="https://via.placeholder.com/100" alt="avatar"/>
          <input type="file" id="avatarInput" accept="image/*" hidden />
          <button onclick="document.getElementById('avatarInput').click()">📷 Change Image</button>
        </div>
        <label>Name
          <input id="editName" type="text" placeholder="Your name"/>
        </label>
        <label>Username
          <input id="editUsername" type="text" placeholder="@username"/>
        </label>
        <label>Bio
          <textarea id="editBio" placeholder="Tell something about you..."></textarea>
        </label>
        <button id="saveProfile">💾 Save Changes</button>
      </div>
    </section>

    <!-- SETTINGS VIEW -->
    <section id="settingsView" class="view">
      <div class="settings">
        <div class="setting-row">
          <span>🕶️ Hide Online Status</span>
          <label class="switch">
            <input type="checkbox" id="hideOnline" />
            <span class="slider"></span>
          </label>
        </div>
        <div class="setting-row">
          <span>🔑 Change Password</span>
          <button id="changePwBtn">Change</button>
        </div>
        <div class="setting-row">
          <span>➕ Add Account</span>
          <button id="addAccountBtn">Add</button>
        </div>

        <h3>📱 Logged-in Devices</h3>
        <div id="devicesList"></div>

        <button id="logoutBtn" class="danger">🚪 Logout</button>
        <button id="deleteAccountBtn" class="danger">🗑️ Delete Account Permanently</button>
      </div>
    </section>

    <!-- CHAT VIEW (overlay) -->
    <section id="chatView" class="view chat-view">
      <div class="chat-header">
        <button id="backFromChat">←</button>
        <img id="chatPeerImg" src="https://via.placeholder.com/40"/>
        <div class="peer-info">
          <strong id="chatPeerName">Chat</strong>
          <small id="chatPeerStatus">offline</small>
        </div>
      </div>

      <div id="messagesList" class="messages"></div>

      <form id="sendForm" class="send-form">
        <input id="msgInput" placeholder="Type a message..." autocomplete="off" required/>
        <button type="submit" title="Send">➤</button>
      </form>
    </section>

    <!-- USER PROFILE VIEW -->
    <section id="userProfileView" class="view">
      <button id="backFromProfile" class="back-top">←</button>
      <div class="profile-card">
        <img id="upAvatar" src="https://via.placeholder.com/100"/>
        <h2 id="upName"></h2>
        <p id="upUsername"></p>
        <p id="upBio"></p>
        <p id="upStatus"></p>
        <button id="upStartChat">💬 Start Chat</button>
      </div>
    </section>

    <!-- BOTTOM NAV -->
    <nav class="bottom-nav" id="bottomNav">
      <button class="nav-btn active" data-view="usersView" data-title="Users">
        <span class="nav-icon">👥</span>
        <span class="nav-label">Users</span>
      </button>
      <button class="nav-btn" data-view="chatsView" data-title="Chats">
        <span class="nav-icon">💬</span>
        <span class="nav-label">Chats</span>
        <span id="totalChatCount" class="nav-badge hidden">0</span>
      </button>
      <button class="nav-btn" data-view="profileView" data-title="Profile">
        <span class="nav-icon">👤</span>
        <span class="nav-label">Profile</span>
      </button>
      <button class="nav-btn" data-view="settingsView" data-title="Settings">
        <span class="nav-icon">⚙️</span>
        <span class="nav-label">Settings</span>
      </button>
    </nav>
  </div>

  <div id="toast" class="toast hidden"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<script>
// ============ FIREBASE CONFIG ============
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyADtnh5wIUO4mBaX4Co6Q_jKYzhzSgZ6p0",
  authDomain: "xcyberchat-dd4f5.firebaseapp.com",
  databaseURL: "https://xcyberchat-dd4f5-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "xcyberchat-dd4f5",
  storageBucket: "xcyberchat-dd4f5.firebasestorage.app",
  messagingSenderId: "212631602126",
  appId: "1:212631602126:web:e322b6d41da4b8e657619f"
};

let db, firebaseReady = false;

function initFirebase() {
  try {
    if (!firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG);
    db = firebase.database();
    firebaseReady = true;
    console.log('✅ Firebase ready:', FIREBASE_CONFIG.projectId);
  } catch (e) {
    console.error('❌ Firebase init failed', e);
    alert('Firebase init failed: ' + e.message);
  }
}

// ============ UTILITIES ============
const $ = (id) => document.getElementById(id);
const now = () => Date.now();
const uid = () => Math.random().toString(36).slice(2) + now().toString(36);
const sha = async (str) => {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
  return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, '0')).join('');
};
function toast(msg) {
  const t = $('toast');
  if (!t) return;
  t.textContent = msg;
  t.classList.remove('hidden');
  clearTimeout(t._t);
  t._t = setTimeout(() => t.classList.add('hidden'), 2500);
}
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  $(id).classList.add('active');
}
function showView(id, title) {
  const isChat = id === 'chatView';
  document.querySelectorAll('#mainScreen .view').forEach(v => v.classList.remove('active'));
  $(id).classList.add('active');

  const nav = $('bottomNav');
  const header = $('appHeader');
  if (isChat) {
    nav.classList.add('hidden');
    header.classList.add('hidden');
    $('chatMenuBtn').classList.remove('hidden');
  } else {
    nav.classList.remove('hidden');
    header.classList.remove('hidden');
    $('chatMenuBtn').classList.add('hidden');
    document.querySelectorAll('.nav-btn').forEach(b => {
      b.classList.toggle('active', b.dataset.view === id);
    });
    if (title) $('appTitle').textContent = title;
  }
}
function fmtTime(ts) {
  const d = new Date(ts);
  return d.getHours().toString().padStart(2,'0') + ':' + d.getMinutes().toString().padStart(2,'0');
}
function fmtDate(ts) {
  return new Date(ts).toLocaleString();
}
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// ============ STATE ============
let me = null;
let currentPeer = null;
let currentChatKey = null;
let unsubMessages = null;
let unsubPeer = null;
let typingTimer = null;
const accounts = {};

// ============ AUTH ============
async function register(name, username, email, password) {
  if (!email.endsWith('@gmail.com')) { toast('Only Gmail allowed'); return null; }
  username = username.toLowerCase().replace(/[^a-z0-9_]/g,'');
  if (!username) { toast('Invalid username'); return null; }

  const snapUser = await db.ref('usernames/' + username).get();
  if (snapUser.exists()) { toast('Username taken'); return null; }
  const snapEmail = await db.ref('emails/' + email.replace(/\./g,',')).get();
  if (snapEmail.exists()) { toast('Email already registered'); return null; }

  const newUid = 'u_' + uid();
  const passHash = await sha(password);
  const user = {
    uid: newUid, name, username, email, bio: '', avatar: '',
    password: passHash, createdAt: now(),
    hideOnline: false, lastSeen: now(), online: true,
    emoji: '', typing: false
  };
  await db.ref('users/' + newUid).set(user);
  await db.ref('usernames/' + username).set(newUid);
  await db.ref('emails/' + email.replace(/\./g,',')).set(newUid);
  return user;
}

async function login(identifier, password) {
  let userUid = null;
  if (identifier.includes('@')) {
    if (!identifier.endsWith('@gmail.com')) { toast('Only Gmail allowed'); return null; }
    const s = await db.ref('emails/' + identifier.replace(/\./g,',')).get();
    userUid = s.val();
  } else {
    const s = await db.ref('usernames/' + identifier.toLowerCase()).get();
    userUid = s.val();
  }
  if (!userUid) { toast('Account not found'); return null; }
  const u = (await db.ref('users/' + userUid).get()).val();
  const passHash = await sha(password);
  if (u.password !== passHash) { toast('Wrong password'); return null; }
  return u;
}

// ============ SESSION ============
function saveSession(user) {
  accounts[user.uid] = user;
  let active = JSON.parse(localStorage.getItem('activeAccounts') || '[]');
  if (!active.includes(user.uid)) active.push(user.uid);
  localStorage.setItem('activeAccounts', JSON.stringify(active));
  localStorage.setItem('currentUid', user.uid);
  localStorage.setItem('acc_' + user.uid, JSON.stringify(user));
}
function loadAccounts() {
  const active = JSON.parse(localStorage.getItem('activeAccounts') || '[]');
  active.forEach(u => {
    const a = localStorage.getItem('acc_' + u);
    if (a) accounts[u] = JSON.parse(a);
  });
}

// ============ ENTER APP ============
async function enterApp(user) {
  me = user;
  saveSession(user);
  showScreen('mainScreen');
  showView('usersView', 'Users');
  startPresence();
  watchMyUser();
  watchUsers();
  watchChats();
  watchDevices();
  logSession();
  toast('Welcome ' + user.name);
}

// ============ PRESENCE ============
function startPresence() {
  const myRef = db.ref('users/' + me.uid);
  const connectedRef = db.ref('.info/connected');
  connectedRef.on('value', (snap) => {
    if (snap.val() === true) {
      myRef.child('online').set(true);
      myRef.child('online').onDisconnect().set(false);
      myRef.child('lastSeen').onDisconnect().set(now());
    }
  });
}

function watchMyUser() {
  db.ref('users/' + me.uid).on('value', (s) => {
    const u = s.val();
    if (!u) return;
    me = Object.assign(me, u);
    $('myAvatar').src = u.avatar || 'https://via.placeholder.com/100';
    $('editName').value = u.name || '';
    $('editUsername').value = u.username || '';
    $('editBio').value = u.bio || '';
    $('hideOnline').checked = !!u.hideOnline;
  });
}

// ============ USERS LIST ============
function watchUsers() {
  db.ref('banned').on('value', (bSnap) => {
    const banned = bSnap.val() || {};
    db.ref('users').on('value', (snap) => {
      const users = snap.val() || {};
      const list = $('usersList');
      list.innerHTML = '';
      const arr = Object.values(users).filter(u => u.uid !== me.uid && !banned[u.uid]);
      if (!arr.length) {
        list.innerHTML = `<div class="empty-state"><div class="icon">👥</div><p>Koi doosra user nahi mila abhi</p></div>`;
        return;
      }
      arr.forEach(u => {
        const div = document.createElement('div');
        div.className = 'user-item';
        div.innerHTML = `
          <img src="${u.avatar || 'https://via.placeholder.com/48'}" />
          <div class="user-meta">
            <strong>${escapeHtml(u.emoji || '')}${escapeHtml(u.name)}</strong>
            <small>@${escapeHtml(u.username)} • ${u.online && !u.hideOnline ? '🟢 online' : '⚪ offline'}</small>
          </div>
          <div class="item-actions">
            <button class="chat-btn">💬</button>
            <button class="req-btn req">➕</button>
          </div>`;
        div.querySelector('img').onclick = (e) => { e.stopPropagation(); openUserProfile(u.uid); };
        div.querySelector('.chat-btn').onclick = (e) => { e.stopPropagation(); startChatWith(u.uid); };
        div.querySelector('.req-btn').onclick = (e) => { e.stopPropagation(); sendFriendRequest(u.uid); };
        list.appendChild(div);
      });
    });
  });
}

// ============ FRIEND REQUEST ============
async function sendFriendRequest(toUid) {
  await db.ref('requests/' + toUid + '/' + me.uid).set({
    from: me.uid, to: toUid, at: now(), status: 'pending'
  });
  toast('✅ Request sent');
}

// ============ CHAT ============
function chatKey(a, b) { return [a, b].sort().join('_'); }

async function startChatWith(peerUid) {
  const peer = (await db.ref('users/' + peerUid).get()).val();
  if (!peer) { toast('User not found'); return; }
  const key = chatKey(me.uid, peerUid);
  await db.ref('chats/' + key + '/members').set({ [me.uid]: true, [peerUid]: true });
  openChat(peer, key);
}

function watchChats() {
  db.ref('chats').on('value', (snap) => {
    const all = snap.val() || {};
    const myChats = [];
    Object.entries(all).forEach(([key, c]) => {
      if (c.members && c.members[me.uid]) myChats.push({ key, data: c });
    });
    renderChatsList(myChats);
    let total = 0;
    myChats.forEach(c => {
      const un = c.data.unread && c.data.unread[me.uid] ? c.data.unread[me.uid] : 0;
      total += un;
    });
    const b = $('totalChatCount');
    b.textContent = total;
    b.classList.toggle('hidden', total === 0);
  });
}

async function renderChatsList(myChats) {
  const list = $('chatsList');
  list.innerHTML = '';
  if (!myChats.length) {
    list.innerHTML = `<div class="empty-state"><div class="icon">💬</div><p>Abhi koi chat nahi hai</p></div>`;
    return;
  }
  for (const c of myChats) {
    const peerUid = Object.keys(c.data.members).find(x => x !== me.uid);
    if (!peerUid) continue;
    const peer = (await db.ref('users/' + peerUid).get()).val();
    if (!peer) continue;
    const un = c.data.unread && c.data.unread[me.uid] ? c.data.unread[me.uid] : 0;
    const last = c.data.lastMessage || {};
    const div = document.createElement('div');
    div.className = 'chat-item';
    div.innerHTML = `
      <img src="${peer.avatar || 'https://via.placeholder.com/48'}" />
      <div class="user-meta">
        <strong>${escapeHtml(peer.emoji || '')}${escapeHtml(peer.name)} ${un ? `<span class="unread-dot">${un}</span>`: ''}</strong>
        <small>${last.text ? escapeHtml(last.text.slice(0,28)) : 'No messages yet'}</small>
        <small>@${escapeHtml(peer.username)} • ${peer.online && !peer.hideOnline ? '🟢 online' : '⚪ offline'}</small>
      </div>`;
    div.onclick = () => openChat(peer, c.key);
    list.appendChild(div);
  }
}

function openChat(peer, key) {
  currentPeer = peer;
  currentChatKey = key;
  $('chatPeerName').textContent = (peer.emoji||'') + peer.name;
  $('chatPeerImg').src = peer.avatar || 'https://via.placeholder.com/40';
  $('chatPeerStatus').textContent = peer.hideOnline ? 'offline' : (peer.online ? '🟢 online' : 'last seen ' + fmtDate(peer.lastSeen));

  showView('chatView');

  db.ref('chats/' + key + '/unread/' + me.uid).set(0);

  if (unsubMessages) unsubMessages();
  unsubMessages = db.ref('chats/' + key + '/messages').on('value', (snap) => {
    const msgs = snap.val() || {};
    const list = $('messagesList');
    list.innerHTML = '';
    const entries = Object.entries(msgs);
    if (!entries.length) {
      list.innerHTML = `<div class="empty-state"><div class="icon">👋</div><p>Say hi to start the conversation</p></div>`;
    }
    entries.forEach(([mid, m]) => {
      if (m.deletedFor && m.deletedFor[me.uid]) return;
      const isMe = m.from === me.uid;
      const div = document.createElement('div');
      div.className = 'msg ' + (isMe ? 'me' : 'them');
      div.innerHTML = `${escapeHtml(m.text)}<span class="time">${fmtTime(m.at)}</span>${isMe ? `<button class="unsend" data-mid="${mid}">×</button>` : ''}`;
      if (isMe) div.querySelector('.unsend').onclick = () => unsendMessage(key, mid);
      list.appendChild(div);
    });
    list.scrollTop = list.scrollHeight;
  });

  if (unsubPeer) unsubPeer();
  unsubPeer = db.ref('users/' + peer.uid).on('value', (s) => {
    const u = s.val();
    if (!u) return;
    currentPeer = u;
    const st = u.hideOnline ? 'offline' : (u.online ? '🟢 online' : 'last seen ' + fmtDate(u.lastSeen));
    $('chatPeerStatus').textContent = st + (u.typing ? ' • typing...' : '');
  });

  setTimeout(() => $('msgInput').focus(), 200);
}

// ============ SEND MESSAGE ============
$('sendForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const txt = $('msgInput').value.trim();
  if (!txt || !currentPeer || !currentChatKey) return;
  const key = currentChatKey;
  const mid = 'm_' + uid();
  await db.ref('chats/' + key + '/messages/' + mid).set({
    mid, from: me.uid, to: currentPeer.uid, text: txt, at: now()
  });
  await db.ref('chats/' + key + '/lastMessage').set({ text: txt, at: now(), from: me.uid });
  const un = (await db.ref('chats/' + key + '/unread/' + currentPeer.uid).get()).val() || 0;
  await db.ref('chats/' + key + '/unread/' + currentPeer.uid).set(un + 1);
  $('msgInput').value = '';

  db.ref('users/' + me.uid + '/typing').set(true);
  clearTimeout(typingTimer);
  typingTimer = setTimeout(() => db.ref('users/' + me.uid + '/typing').set(false), 1500);
});

// ============ UNSEND ============
async function unsendMessage(key, mid) {
  await db.ref('chats/' + key + '/messages/' + mid).remove();
  toast('🗑️ Unsent');
}

// ============ CLEAR CHAT ============
$('clearChatBtn').onclick = async () => {
  if (!currentChatKey) return;
  if (!confirm('Clear chat for everyone?')) return;
  await db.ref('chats/' + currentChatKey + '/messages').remove();
  toast('Chat cleared for everyone');
  $('chatMenu').classList.add('hidden');
};

// ============ PROFILE EDIT ============
$('avatarInput').addEventListener('change', (e) => {
  const f = e.target.files[0];
  if (!f) return;
  const reader = new FileReader();
  reader.onload = async () => {
    await db.ref('users/' + me.uid + '/avatar').set(reader.result);
    toast('✅ Avatar updated');
  };
  reader.readAsDataURL(f);
});

$('saveProfile').onclick = async () => {
  const newName = $('editName').value.trim();
  const newUsername = $('editUsername').value.trim().toLowerCase().replace(/[^a-z0-9_]/g,'');
  const newBio = $('editBio').value.trim();
  if (!newName || !newUsername) { toast('Name & username required'); return; }
  if (newUsername !== me.username) {
    const s = await db.ref('usernames/' + newUsername).get();
    if (s.exists()) { toast('Username taken'); return; }
    await db.ref('usernames/' + me.username).remove();
    await db.ref('usernames/' + newUsername).set(me.uid);
    await db.ref('users/' + me.uid + '/username').set(newUsername);
  }
  await db.ref('users/' + me.uid).update({ name: newName, bio: newBio });
  toast('✅ Profile saved');
};

// ============ SETTINGS ============
$('hideOnline').onchange = (e) => {
  db.ref('users/' + me.uid + '/hideOnline').set(e.target.checked);
};

$('changePwBtn').onclick = async () => {
  const oldPw = prompt('Current password:');
  if (!oldPw) return;
  const oldHash = await sha(oldPw);
  if (oldHash !== me.password) { toast('Wrong password'); return; }
  const newPw = prompt('New password:');
  if (!newPw || newPw.length < 4) { toast('Password too short'); return; }
  const h = await sha(newPw);
  await db.ref('users/' + me.uid + '/password').set(h);
  toast('✅ Password updated');
};

$('addAccountBtn').onclick = () => {
  showScreen('authScreen');
  $('loginForm').classList.add('active');
  $('registerForm').classList.remove('active');
  $('forgotForm').classList.remove('active');
  $('loginTab').classList.add('active');
  $('registerTab').classList.remove('active');
  $('loginEmail').value = '';
  $('loginPassword').value = '';
};

$('logoutBtn').onclick = async () => {
  if (!confirm('Logout?')) return;
  await db.ref('users/' + me.uid + '/online').set(false);
  await db.ref('users/' + me.uid + '/lastSeen').set(now());
  let active = JSON.parse(localStorage.getItem('activeAccounts') || '[]');
  active = active.filter(x => x !== me.uid);
  localStorage.setItem('activeAccounts', JSON.stringify(active));
  localStorage.removeItem('acc_' + me.uid);
  localStorage.removeItem('currentUid');
  delete accounts[me.uid];
  location.reload();
};

$('deleteAccountBtn').onclick = async () => {
  if (!confirm('⚠️ Permanently delete account? This cannot be undone.')) return;
  if (!confirm('Are you REALLY sure?')) return;
  await db.ref('usernames/' + me.username).remove();
  await db.ref('emails/' + me.email.replace(/\./g,',')).remove();
  await db.ref('users/' + me.uid).remove();
  let active = JSON.parse(localStorage.getItem('activeAccounts') || '[]');
  active = active.filter(x => x !== me.uid);
  localStorage.setItem('activeAccounts', JSON.stringify(active));
  localStorage.removeItem('acc_' + me.uid);
  localStorage.removeItem('currentUid');
  location.reload();
};

// ============ DEVICES ============
function watchDevices() {
  db.ref('sessions/' + me.uid).on('value', (s) => {
    const d = s.val() || {};
    const list = $('devicesList');
    list.innerHTML = '';
    const arr = Object.values(d);
    if (!arr.length) {
      list.innerHTML = `<div class="device-item">Koi device nahi mila</div>`;
      return;
    }
    arr.forEach(dev => {
      const el = document.createElement('div');
      el.className = 'device-item';
      el.textContent = `📱 ${dev.ua || 'Unknown'} — logged in at ${fmtDate(dev.at)}`;
      list.appendChild(el);
    });
  });
}

function logSession() {
  const sid = 's_' + uid() + '_' + now();
  const ua = navigator.userAgent;
  db.ref('sessions/' + me.uid + '/' + sid).set({ ua, at: now() });
  window.addEventListener('beforeunload', () => {
    db.ref('sessions/' + me.uid + '/' + sid).remove();
  });
}

// ============ USER PROFILE VIEW ============
async function openUserProfile(uidVal) {
  const u = (await db.ref('users/' + uidVal).get()).val();
  if (!u) { toast('User not found'); return; }
  $('upAvatar').src = u.avatar || 'https://via.placeholder.com/100';
  $('upName').textContent = (u.emoji||'') + u.name;
  $('upUsername').textContent = '@' + u.username;
  $('upBio').textContent = u.bio || 'No bio yet';
  $('upStatus').textContent = u.online && !u.hideOnline ? '🟢 online' : 'last seen ' + fmtDate(u.lastSeen);
  $('upStartChat').onclick = () => startChatWith(uidVal);
  showView('userProfileView', 'Profile');
}

// ============ BACK BUTTONS ============
$('backFromChat').onclick = () => {
  if (unsubMessages) { unsubMessages(); unsubMessages = null; }
  if (unsubPeer) { unsubPeer(); unsubPeer = null; }
  currentChatKey = null;
  currentPeer = null;
  showView('chatsView', 'Chats');
};

$('backFromProfile').onclick = () => {
  showView('usersView', 'Users');
};

// ============ BOTTOM NAV ============
document.querySelectorAll('.nav-btn').forEach(btn => {
  btn.onclick = () => {
    const viewId = btn.dataset.view;
    const title = btn.dataset.title;
    showView(viewId, title);
  };
});

// ============ HEADER MENU (3-dot) ============
$('chatMenuBtn').onclick = (e) => {
  e.stopPropagation();
  $('chatMenu').classList.toggle('hidden');
};
document.addEventListener('click', (e) => {
  if (!e.target.closest('#chatMenu') && !e.target.closest('#chatMenuBtn')) {
    $('chatMenu').classList.add('hidden');
  }
});

// ============ AUTH UI ============
$('loginTab').onclick = () => {
  $('loginTab').classList.add('active'); $('registerTab').classList.remove('active');
  $('loginForm').classList.add('active'); $('registerForm').classList.remove('active'); $('forgotForm').classList.remove('active');
};
$('registerTab').onclick = () => {
  $('registerTab').classList.add('active'); $('loginTab').classList.remove('active');
  $('registerForm').classList.add('active'); $('loginForm').classList.remove('active'); $('forgotForm').classList.remove('active');
};
$('forgotLink').onclick = (e) => {
  e.preventDefault();
  $('loginForm').classList.remove('active'); $('registerForm').classList.remove('active'); $('forgotForm').classList.add('active');
};
$('backLogin').onclick = (e) => {
  e.preventDefault();
  $('forgotForm').classList.remove('active'); $('loginForm').classList.add('active');
};

$('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  if (!firebaseReady) { toast('Firebase not ready'); return; }
  try {
    const u = await login($('loginEmail').value.trim(), $('loginPassword').value);
    if (u) enterApp(u);
  } catch (err) { toast(err.message || 'Login failed'); }
});

$('registerForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  if (!firebaseReady) { toast('Firebase not ready'); return; }
  try {
    const u = await register(
      $('regName').value.trim(),
      $('regUsername').value.trim(),
      $('regEmail').value.trim(),
      $('regPassword').value
    );
    if (u) enterApp(u);
  } catch (err) { toast(err.message || 'Register failed'); }
});

$('forgotForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const email = $('forgotEmail').value.trim();
  if (!email.endsWith('@gmail.com')) { toast('Only Gmail allowed'); return; }
  const s = await db.ref('emails/' + email.replace(/\./g,',')).get();
  if (!s.exists()) { toast('Email not registered'); return; }
  const newPw = prompt('Enter new password:');
  if (!newPw) return;
  const h = await sha(newPw);
  await db.ref('users/' + s.val() + '/password').set(h);
  toast('✅ Password reset. Please login.');
  $('forgotForm').classList.remove('active');
  $('loginForm').classList.add('active');
});

// ============ BOOT ============
(async function boot() {
  initFirebase();
  if (!firebaseReady) return;

  loadAccounts();
  const currentUid = localStorage.getItem('currentUid');
  if (currentUid && accounts[currentUid]) {
    const u = (await db.ref('users/' + currentUid).get()).val();
    if (u) enterApp(u);
    else showScreen('authScreen');
  } else {
    showScreen('authScreen');
  }
})();
</script>
</body>
</html>
