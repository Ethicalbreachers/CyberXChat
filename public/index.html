<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>CyberChat</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div id="app">

  <!-- AUTH SCREEN -->
  <div id="authScreen" class="screen active">
    <div class="auth-box">
      <h1>💬 CyberChat</h1>
      <div class="tabs">
        <button id="loginTab" class="tab active">Login</button>
        <button id="registerTab" class="tab">Register</button>
      </div>

      <form id="loginForm" class="form active">
        <input type="text" id="loginEmail" placeholder="Email or Username" required />
        <input type="password" id="loginPassword" placeholder="Password" required />
        <button type="submit">Login</button>
        <a href="#" id="forgotLink">Forgot Password?</a>
      </form>

      <form id="registerForm" class="form">
        <input type="text" id="regName" placeholder="Full Name" required />
        <input type="text" id="regUsername" placeholder="Username" required />
        <input type="email" id="regEmail" placeholder="Gmail (must be @gmail.com)" required />
        <input type="password" id="regPassword" placeholder="Password" required />
        <button type="submit">Register</button>
      </form>

      <form id="forgotForm" class="form">
        <input type="email" id="forgotEmail" placeholder="Your Gmail" required />
        <button type="submit">Reset Password</button>
        <a href="#" id="backLogin">Back to Login</a>
      </form>
    </div>
  </div>

  <!-- MAIN APP -->
  <div id="mainScreen" class="screen">
    <header class="app-header">
      <h2 id="appTitle">Users</h2>
      <div class="header-actions">
        <button id="chatTabBtn" class="hdr-btn" title="Chats">💬 <span id="totalChatCount" class="badge">0</span></button>
        <button id="profileBtn" class="hdr-btn" title="Profile">👤</button>
        <button id="settingsBtn" class="hdr-btn" title="Settings">⚙️</button>
      </div>
    </header>

    <section id="usersView" class="view active">
      <div id="usersList" class="list"></div>
    </section>

    <section id="chatsView" class="view">
      <div id="chatsList" class="list"></div>
    </section>

    <section id="profileView" class="view">
      <div class="profile-edit">
        <div class="avatar-wrap">
          <img id="myAvatar" src="https://via.placeholder.com/100" alt="avatar"/>
          <input type="file" id="avatarInput" accept="image/*" hidden />
          <button onclick="document.getElementById('avatarInput').click()">Change Image</button>
        </div>
        <label>Name<input id="editName" type="text"/></label>
        <label>Username<input id="editUsername" type="text"/></label>
        <label>Bio<textarea id="editBio"></textarea></label>
        <button id="saveProfile">Save</button>
      </div>
    </section>

    <section id="settingsView" class="view">
      <div class="settings">
        <div class="setting-row">
          <span>Hide Online Status</span>
          <input type="checkbox" id="hideOnline" />
        </div>
        <div class="setting-row">
          <span>Change Password</span>
          <button id="changePwBtn">Change</button>
        </div>
        <div class="setting-row">
          <span>Add Account</span>
          <button id="addAccountBtn">Add</button>
        </div>
        <h3>Logged-in Devices</h3>
        <div id="devicesList"></div>
        <button id="logoutBtn" class="danger">Logout</button>
        <button id="deleteAccountBtn" class="danger">Delete Account Permanently</button>
      </div>
    </section>

    <section id="chatView" class="view chat-view">
      <div class="chat-header">
        <button id="backFromChat">←</button>
        <img id="chatPeerImg" src="https://via.placeholder.com/40"/>
        <div class="peer-info">
          <strong id="chatPeerName"></strong>
          <small id="chatPeerStatus">offline</small>
        </div>
        <button id="chatMenuBtn">⋮</button>
        <div id="chatMenu" class="dropdown hidden">
          <button id="clearChatBtn">Clear Chat (for everyone)</button>
        </div>
      </div>
      <div id="messagesList" class="messages"></div>
      <form id="sendForm" class="send-form">
        <input id="msgInput" placeholder="Type a message..." autocomplete="off"/>
        <button type="submit">Send</button>
      </form>
    </section>

    <section id="userProfileView" class="view">
      <button id="backFromProfile">←</button>
      <div class="profile-card">
        <img id="upAvatar" src="https://via.placeholder.com/100"/>
        <h2 id="upName"></h2>
        <p id="upUsername"></p>
        <p id="upBio"></p>
        <p id="upStatus"></p>
        <button id="upStartChat">Start Chat</button>
      </div>
    </section>
  </div>

  <div id="toast" class="toast hidden"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<script src="app.js"></script>
</body>
</html>
